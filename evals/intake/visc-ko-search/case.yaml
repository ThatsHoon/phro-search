{
 "schema_version": "1.1",
 "name": "visc-ko-search",
 "tags": [
  "intake",
  "open"
 ],
 "runs": 1,
 "execution": {
  "max_turns": 20,
  "timeout_seconds": 600,
  "allowed_tools": [
   "Skill",
   "Read",
   "Glob",
   "Grep"
  ],
  "prompt": "/phro-search:search 요즘 우리 서비스 검색 결과가 뭔가 이상하다는 말이 많아. 뭘 봐야 할지 모르겠어."
 },
 "graders": [
  {
   "name": "candidates",
   "type": "llm",
   "criteria": "Either the reply offers 2 or 3 candidate briefs for the user to choose from, the recommended one first, each saying what to research, the deliverable and when the research is done; or it asks situation and use questions now and says candidate briefs come after the answers."
  },
  {
   "name": "map-first",
   "type": "llm",
   "criteria": "One of the candidate briefs is to map the field first (its terms, people and venues) and sharpen the brief after that, or the reply says the candidate briefs to come will include that."
  },
  {
   "name": "questions",
   "type": "llm",
   "criteria": "Every question the reply asks offers concrete options, with the recommended one marked or listed first and a way to answer 'don't know' that takes the default. Picking one of the candidate briefs counts as answering with an option. The reply asks at most 4 questions."
  },
  {
   "name": "gate",
   "type": "llm",
   "criteria": "The reply ends by waiting for the user's answers, pick or confirmation before the research itself. It may name terms, sub-areas, works and how recent the activity is, from a quick look; it gives no answer to the request and no results or numbers taken from sources."
  },
  {
   "name": "situation",
   "type": "llm",
   "criteria": "The reply asks about the user's situation or what the result is for (what they noticed, who is affected, what decision or fix it feeds), not only which keywords to search."
  },
  {
   "name": "probe",
   "type": "tool_used",
   "tool": "WebSearch",
   "min": 0,
   "max": 3
  },
  {
   "name": "read-intake",
   "type": "tool_used",
   "tool": "Read",
   "input_match": "intake.md",
   "min": 1
  }
 ]
}
